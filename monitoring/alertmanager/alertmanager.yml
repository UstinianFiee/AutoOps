global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://backend:8000/api/monitor/webhook'
        send_resolved: true

  - name: 'critical-receiver'
    webhook_configs:
      - url: 'http://backend:8000/api/monitor/webhook'
        send_resolved: true
    # 钉钉告警（取消注释并填写 webhook）
    # - url: 'https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']

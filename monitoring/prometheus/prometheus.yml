global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      # AutoOps 本机 node-exporter（Docker 容器）
      - targets: ['node-exporter:9100']
        labels:
          alias: 'AutoOps本机'
      # 远程受管服务器
      - targets: ['106.75.146.115:9100']
        labels:
          alias: '106.75.146.115'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

---
- name: 初始化服务器（安装 Docker 等基础环境）
  hosts: target
  become: yes
  gather_facts: yes

  tasks:
    # ── 基础依赖 ─────────────────────────────────────────────────────────────
    - name: 更新 apt 缓存（Debian/Ubuntu）
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: 安装基础依赖（Debian/Ubuntu）
      apt:
        name:
          - curl
          - wget
          - git
          - vim
          - ca-certificates
          - gnupg
          - lsb-release
          - python3-pip
          - apt-transport-https
        state: present
      when: ansible_os_family == "Debian"

    - name: 安装基础依赖（RedHat/CentOS）
      yum:
        name: [curl, wget, git, vim, ca-certificates, python3-pip, yum-utils]
        state: present
      when: ansible_os_family == "RedHat"

    # ── 检查 Docker ──────────────────────────────────────────────────────────
    - name: 检查 Docker 是否已安装
      command: docker --version
      register: docker_check
      ignore_errors: yes
      changed_when: false

    # ── Ubuntu/Debian 安装 Docker ────────────────────────────────────────────
    - name: 添加 Docker GPG 密钥（Ubuntu/Debian）
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when:
        - ansible_os_family == "Debian"
        - docker_check.rc != 0

    # ✅ 新增：确保 sources.list.d 目录存在（避免 tee 报错目录不存在）
    - name: 确保 apt 源配置目录存在
      file:
        path: /etc/apt/sources.list.d
        state: directory
        mode: '0755'
      when:
        - ansible_os_family == "Debian"
        - docker_check.rc != 0

    - name: 添加 Docker apt 仓库（Ubuntu/Debian）
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
          | tee /etc/apt/sources.list.d/docker.list > /dev/null
      args:
        creates: /etc/apt/sources.list.d/docker.list
      when:
        - ansible_os_family == "Debian"
        - docker_check.rc != 0

    - name: 安装 Docker CE（Ubuntu/Debian）
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      when:
        - ansible_os_family == "Debian"
        - docker_check.rc != 0

    # ── CentOS/RedHat 安装 Docker ────────────────────────────────────────────
    - name: 添加 Docker yum 仓库（CentOS/RedHat）
      shell: |
        yum-config-manager --add-repo \
          https://download.docker.com/linux/centos/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo
      when:
        - ansible_os_family == "RedHat"
        - docker_check.rc != 0

    - name: 安装 Docker CE（CentOS/RedHat）
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
      when:
        - ansible_os_family == "RedHat"
        - docker_check.rc != 0

    # ── 启动 Docker ──────────────────────────────────────────────────────────
    - name: 启动并设置 Docker 开机自启
      systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes

    # ── 配置 ─────────────────────────────────────────────────────────────────
    - name: 创建应用部署目录
      file:
        path: /opt/apps
        state: directory
        mode: '0755'

    - name: 配置 Docker 日志限制
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "100m",
              "max-file": "3"
            }
          }
      notify: restart docker

    - name: 验证 Docker 安装
      command: docker --version
      register: docker_ver
      changed_when: false

    - name: 输出结果
      debug:
        msg: "初始化完成！{{ docker_ver.stdout }}"

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
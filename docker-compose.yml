version: '3.9'

networks:
  autoops:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ── MySQL ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: autoops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: autoops
      MYSQL_USER: autoops
      MYSQL_PASSWORD: autoops123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - autoops
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uautoops", "-pautoops123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ────────────────────────────────────────
  backend:
    build: ./backend
    container_name: autoops-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://autoops:autoops123@mysql:3306/autoops
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
      # 挂载 prometheus 配置到固定路径，允许后端动态更新并热重载
      - ./monitoring/prometheus/prometheus.yml:/etc/autoops/prometheus.yml
    ports:
      - "8000:8000"
    networks:
      - autoops
    depends_on:
      mysql:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: autoops-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - autoops
    depends_on:
      - backend

  # ── Prometheus ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: autoops-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - autoops

  # ── Alertmanager ───────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: autoops-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - autoops

  # ── Grafana ────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: autoops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 子路径配置（通过 nginx /grafana/ 代理访问）
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 允许 iframe 嵌入
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - autoops
    depends_on:
      - prometheus

  # ── Loki ───────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: autoops-loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - autoops

  # ── Promtail ───────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: autoops-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - autoops
    depends_on:
      - loki

  # ── Node Exporter ──────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: autoops-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - autoops

  # ── cAdvisor ───────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: autoops-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - autoops
